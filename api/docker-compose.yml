services:
  db:
    # Multi-arch PostGIS image (linux/arm64 + amd64). Official postgis/postgis:16-3.5
    # currently lacks arm64 manifests on Apple Silicon hosts.
    image: ghcr.io/baosystems/postgis:16
    container_name: sesh-postgres
    restart: unless-stopped
    ports:
      # Bind to localhost only. Default host port 5433 avoids clashing with a
      # system Postgres often already listening on 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sesh}
      POSTGRES_DB: ${POSTGRES_DB:-sesh}
    volumes:
      - sesh_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sesh} -d ${POSTGRES_DB:-sesh}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  sesh_pgdata:
